# Bundle patch used by DSH plugin installation.
#
# Load together with the router via dsh-combined-patch.yml at the repo root.

- id: compaction-basic
  disabled: false
  config:
    auto: false

- insert:
    - id: dsh-local-model-guard
      name: "dsh-local-model-guard"
