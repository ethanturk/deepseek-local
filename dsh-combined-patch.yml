# Combined patch: model-router + local-model-guard + OpenAI gateway
# After cloning, replace every ABSOLUTE_REPO_ROOT with your clone path.
#
# Usage from a deepseek-harness checkout:
#   pnpm dsh web --patch /ABSOLUTE_REPO_ROOT/dsh-combined-patch.yml

- insert:
    - id: dsh-model-router
      name: "/ABSOLUTE_REPO_ROOT/dsh-model-router/src/index.ts"
      # Tier assignments live in the model-router section of DSH settings.

    - id: dsh-local-model-guard
      name: "/ABSOLUTE_REPO_ROOT/dsh-local-model-guard/src/index.ts"
      # config:
      #   maxConsecutiveFailures: 2
      #   maxRepeatedCalls: 2
      #   windowSize: 6
      #   forceAlways: false

    - id: dsh-openai-gateway
      name: "/ABSOLUTE_REPO_ROOT/dsh-openai-gateway/src/index.ts"
      # Runtime settings live in the openai-gateway section of DSH settings.
